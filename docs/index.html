        async function releaseNotes() {
            const m = openModal(`<h3>Notas da Versão</h3>
                <div style="font-weight:800">Sua versão: ${PWA_VERSION.name} (${PWA_VERSION.code}) · Web</div>
                <div id="rn-body" style="display:flex;justify-content:center;padding:16px"><div class="spinner"></div></div>
                <div class="modal-actions"><button class="btn btn-text" style="color:var(--green)" data-close>Fechar</button></div>`);
            let html;
            try {
                const res = await fetchWithTimeout('version.json?t=' + Date.now(), { cache: 'no-store' }, 10000);
                const info = await res.json();
                const notes = String(info.release_notes || '').split(/\s*\*\s+/).map(s => s.trim()).filter(Boolean);
                html = `<div style="color:var(--green);margin-top:8px">Última: v${esc(info.version_name || info.version_code)}</div>
                    <ul class="notes">${notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>`;
            } catch (_) {
                html = '<div style="color:var(--green);margin-top:8px">Última: Indisponível</div><div style="color:var(--muted)">Erro ao buscar notas.</div>';
            }
            const body = m.querySelector('#rn-body');
            if (body) body.outerHTML = html;
        }

        // ─── Partida (RegisterMatchScreen.kt / MatchViewModel.kt) ────────────────────
        const TIPOS_BATIDA = [{ pontos: 1, label: 'Simples' }, { pontos: 2, label: 'Carroça' }, { pontos: 3, label: 'Lá e Lô' }, { pontos: 4, label: 'Cruzada' }];
        const blankMatchState = () => ({
            selected: [null, null, null, null], score1: 0, score2: 0, fechas: 0,
            isBuchoRe: false, isBuchoReEnabled: false, loading: false, error: null,
            editing: null, isModuleAvailable: true, remaining: null,
            isActive: false, activeMatchId: null, availablePlayers: []
        });

        const Jogar = {
            st: blankMatchState(),
            timer: null,

            async open(editId) {
                Jogar.st = blankMatchState();
                const st = Jogar.st;
                viewCleanup = () => { clearInterval(Jogar.timer); Jogar.timer = null; Jogar.st = blankMatchState(); };
                st.loading = true;
                Jogar.render();
                if (!S.loaded || !editId) await loadData();
                hideBoot();
                if (!S.loaded) { st.loading = false; st.error = 'Falha ao carregar jogadores: ' + (S.loadError || ''); Jogar.render(); return; }
                st.availablePlayers = eligiblePlayers();
                st.loading = false;
                if (editId) {
                    const m = S.matches.find(x => x.id === editId);
                    if (!m) { st.error = 'Partida não encontrada.'; Jogar.render(); return; }
                    st.selected = [...m.players];
                    st.score1 = m.score1; st.score2 = m.score2;
                    st.isBuchoRe = m.wasBuchoRe;
                    st.isBuchoReEnabled = (m.score1 === 5 && m.score2 > 5) || (m.score2 === 5 && m.score1 > 5);
                    st.editing = { id: m.id, date: m.date, registeredBy: m.registeredBy, s1: m.score1, s2: m.score2, re: m.wasBuchoRe, players: [...m.players] };
                } else {
                    await Jogar.loadActiveMatch();
                }
                if (Jogar.st !== st) return; // saiu da tela durante o carregamento
                Jogar.render();
                Jogar.startTimer();
            },

            // Recupera a partida em andamento do usuário (aberta antes de sair da tela ou do app).
            async loadActiveMatch() {
                const st = Jogar.st;
                try {
                    const list = await api('webhook/partidas-em-andamento?jogador=' + encodeURIComponent(S.user.name));
                    const a = Array.isArray(list) ? list[0] : null;
                    if (!a || Jogar.st !== st) return;
                    const find = n => st.availablePlayers.find(u => u.name === n) || null;
                    st.selected = [find(a.jogador1), find(a.jogador2), find(a.jogador3), find(a.jogador4)];
                    st.isActive = true;
                    st.activeMatchId = a.id;
                    st.score1 = a.score1 || 0; st.score2 = a.score2 || 0; st.fechas = a.fechas || 0;
                    st.isBuchoReEnabled = (st.score1 === 5 && st.score2 > 5) || (st.score2 === 5 && st.score1 > 5);
                } catch (_) {}
            },

            startTimer() {
                clearInterval(Jogar.timer);
                let running = false;
                const tick = async () => {
                    const st = Jogar.st;
                    if (st.editing || running) return;
                    running = true;
                    try { await tickOnce(st); } finally { running = false; }
                };
                const tickOnce = async st => {
                    const available = st.isActive || await isModuleAvailable();
                    const remaining = remainingSecondsToClose();
                    const before = JSON.stringify([st.isModuleAvailable, st.remaining, st.error]);
                    if (!available) {
                        st.isModuleAvailable = false; st.remaining = null; st.error = blockedMessage();
                    } else {
                        if (!st.isModuleAvailable && st.error && st.error.startsWith('MÓDULO BLOQUEADO')) st.error = null;
                        st.isModuleAvailable = true; st.remaining = remaining;
                    }
                    if (JSON.stringify([st.isModuleAvailable, st.remaining, st.error]) !== before) Jogar.render();
                };
                tick();
                Jogar.timer = setInterval(tick, 1000);
            },

            render() {
                const h = location.hash.replace(/^#/, '');
                if (!h.startsWith('/jogar')) return;
                const st = Jogar.st;
                const isEditing = !!st.editing;
                const gameplay = isEditing || st.isActive;
                const selectEnabled = isEditing || !st.isActive;
                const slot = (i, color) => {
                    const p = st.selected[i];
                    return `<button class="slot ${p ? 'filled' : ''}" ${selectEnabled ? `onclick="App.pickPlayer(${i})"` : 'disabled'}>
                        ${p ? avatar(p.photoUrl, 32, 0, 'transparent') : `<span class="q" style="background:${color}">?</span>`}
                        <span class="nm">${p ? esc(firstName(p.displayName)) : 'Selecionar'}</span>
                        ${selectEnabled ? '<span class="chev">▼</span>' : ''}
                    </button>`;
                };
                const showTeams = isEditing || st.isActive;
                const players = showTeams
                    ? `<div class="team-header" style="color:var(--green)">TIME 1</div>
                       <div class="slots">${slot(0, 'var(--green)')}${slot(1, 'var(--green)')}</div>
                       <div class="vs"><span>VS</span></div>
                       <div class="team-header" style="color:var(--orange)">TIME 2</div>
                       <div class="slots">${slot(2, 'var(--team2)')}${slot(3, 'var(--team2)')}</div>`
                    : `<div class="team-header" style="color:var(--green);margin-bottom:10px">JOGADORES</div>
                       <div class="draw-note"><span style="font-size:16px">🎲</span>As duplas serão sorteadas ao confirmar a abertura</div>
                       <div class="slots">${slot(0, 'var(--green)')}${slot(1, 'var(--green)')}</div>
                       <div class="slots" style="margin-top:8px">${slot(2, 'var(--team2)')}${slot(3, 'var(--team2)')}</div>`;

                const scoreCtl = (team, accent, accentBg) => {
                    const p1 = st.selected[team === 1 ? 0 : 2], p2 = st.selected[team === 1 ? 1 : 3];
                    const score = team === 1 ? st.score1 : st.score2;
                    const n1 = p1 ? firstName(p1.displayName) : 'Time', n2 = p2 ? firstName(p2.displayName) : '';
                    const holder = p => p ? avatar(p.photoUrl, 40, 1.5, '#fff') : '<span class="av" style="width:40px;height:40px;border-width:1.5px;border-color:#fff;background:#555"></span>';
                    return `<div class="score-ctl">
                        <div class="t">TIME ${team}</div>
                        <div class="avs">${holder(p1)}${holder(p2)}</div>
                        <div class="names">${esc(n2 ? `${n1} / ${n2}` : n1)}</div>
                        <div class="ctl">
                            <button class="round" style="background:${accentBg};color:${accent}" ${gameplay ? `onclick="App.scoreDec(${team})"` : 'disabled'} aria-label="Diminuir">−</button>
                            <div class="score-num" style="color:${gameplay ? 'var(--text)' : 'var(--muted)'}">${score}</div>
                            <button class="round" style="background:${accentBg};color:${accent}" ${gameplay ? `onclick="App.scoreInc(${team})"` : 'disabled'} aria-label="Aumentar">+</button>
                        </div>
                    </div>`;
                };

                let actions;
                const disabled = st.loading || !st.isModuleAvailable;
                if (!isEditing && !st.isActive) {
                    actions = `<button class="btn btn-gold" ${disabled ? 'disabled' : ''} onclick="App.startMatch()">${st.loading ? '<div class="spinner"></div>' : '🎲 Confirmar Abertura da Partida'}</button>`;
                } else {
                    const label = st.loading ? '<div class="spinner"></div>' : !st.isModuleAvailable ? '⏰ Fora do Horário' : isEditing ? '✅ Atualizar Partida' : '🎮 Salvar Partida';
                    actions = `<button class="btn btn-gold" ${disabled ? 'disabled' : ''} onclick="App.saveMatch()">${label}</button>`;
                    if (!isEditing && st.isActive) actions += `<button class="btn btn-outline" style="margin-top:12px" ${st.loading ? 'disabled' : ''} onclick="App.cancelMatch()">❌ Cancelar Partida</button>`;
                }

                const remaining = st.remaining != null ? `<div class="countdown">${ICONS.warning}Fechamento em: ${pad(Math.floor(st.remaining / 60))}:${pad(st.remaining % 60)}</div>` : '';

                $('#app').innerHTML = `<div class="view">
                    ${topbar(isEditing ? 'Editar Partida' : 'Nova Partida', { serif: true })}
                    <div class="stack">
                        ${remaining}
                        <div class="card pcard">${players}</div>
                        <div class="card score-card">
                            <div class="score-row">${scoreCtl(1, 'var(--green)', 'rgba(20,54,33,.1)')}<span class="score-x">×</span>${scoreCtl(2, 'var(--orange)', 'rgba(209,87,63,.1)')}</div>
                            <div class="fechas-row">
                                <span class="lbl">Fechas:</span>
                                <button class="round" style="width:32px;height:32px;background:rgba(138,111,61,.15);color:var(--text)" ${gameplay ? 'onclick="App.fechas(-1)"' : 'disabled'}>−</button>
                                <span class="num">${st.fechas}</span>
                                <button class="round" style="width:32px;height:32px;background:rgba(138,111,61,.15);color:var(--text)" ${gameplay ? 'onclick="App.fechas(1)"' : 'disabled'}>+</button>
                            </div>
                        </div>
                        <label class="card options">
                            <input type="checkbox" ${st.isBuchoRe ? 'checked' : ''} ${st.isBuchoReEnabled && gameplay ? '' : 'disabled'} onchange="App.buchoRe(this.checked)">
                            <div><div class="t" style="color:${st.isBuchoReEnabled ? 'var(--orange)' : 'var(--muted)'};font-weight:${st.isBuchoReEnabled ? 800 : 400}">🔥 Foi Bucho de Ré?</div>${st.isBuchoReEnabled ? '<div class="s">Marque se o placar foi 5 a mais!</div>' : ''}</div>
                        </label>
                        ${st.error ? `<div class="error-box">${esc(st.error)}</div>` : ''}
                        <div>${actions}</div>
                    </div>
                </div>
                ${st.isActive ? '<button class="fab" onclick="App.dailyAwards()" aria-label="Destaques do dia">🏆</button>' : ''}`;
            },

            set(patch) { Object.assign(Jogar.st, patch); Jogar.render(); },

            onScoreChange(team, score) {
                const st = Jogar.st;
                const s1 = team === 1 ? score : st.score1;
                const s2 = team === 2 ? score : st.score2;
                const enabled = (s1 === 5 && s2 > 5) || (s2 === 5 && s1 > 5);
                Jogar.set({ score1: s1, score2: s2, isBuchoReEnabled: enabled, isBuchoRe: enabled ? st.isBuchoRe : false });
                Jogar.persistDraft();
            },

            // Placar parcial salvo como rascunho da partida em andamento.
            persistDraft() {
                const st = Jogar.st;
                if (!st.activeMatchId) return;
                api('webhook/partidas-em-andamento/' + encodeURIComponent(st.activeMatchId), { method: 'PATCH', body: { score1: st.score1, score2: st.score2, fechas: st.fechas } }).catch(() => {});
            },

            scoreInc(team) {
                const st = Jogar.st;
                if (st.fechas > 0) return Jogar.batidaDialog(team);
                Jogar.onScoreChange(team, (team === 1 ? st.score1 : st.score2) + 1);
            },
            scoreDec(team) {
                const st = Jogar.st;
                const cur = team === 1 ? st.score1 : st.score2;
                if (cur > 0) Jogar.onScoreChange(team, Math.max(0, cur - 1));
            },
            changeFechas(delta) {
                Jogar.set({ fechas: Math.max(0, Jogar.st.fechas + delta) });
                Jogar.persistDraft();
            },
            batidaDialog(team) {
                const st = Jogar.st;
                const m = openModal(`<h3 style="color:var(--green);font-weight:900">🎯 Tipo de Batida</h3>
                    <div>Fechas acumuladas: ${st.fechas}</div>
                    ${TIPOS_BATIDA.map((t, i) => `<button class="opt-btn" style="justify-content:center;color:var(--green);border-radius:12px" data-b="${i}">${t.label} (${t.pontos} ${t.pontos === 1 ? 'ponto' : 'pontos'})</button>`).join('')}
                    <div class="modal-actions"><button class="btn btn-text" data-close>Cancelar</button></div>`);
                m.querySelectorAll('[data-b]').forEach(b => b.onclick = () => {
                    const tipo = TIPOS_BATIDA[+b.dataset.b];
                    const ganho = Jogar.st.fechas + tipo.pontos;
                    const novo = (team === 1 ? Jogar.st.score1 : Jogar.st.score2) + ganho;
                    m.close();
                    Jogar.st.fechas = 0;
                    Jogar.onScoreChange(team, novo);
                });
            },

            pickPlayer(i) {
                const st = Jogar.st;
                const pool = [...st.availablePlayers];
                // Na edição, os jogadores da partida aparecem mesmo que hoje não estejam elegíveis.
                for (const p of st.selected) if (p && !pool.some(x => x.id === p.id)) pool.push(p);
                const options = pool.filter(p => p === st.selected[i] || !st.selected.some(s => s && s.id === p.id));
                const m = openModal(`<h3>Selecionar Jogador</h3>
                    <input class="picker-search" placeholder="Buscar jogador" autocomplete="off">
                    <div class="picker-list"></div>
                    <div class="modal-actions"><button class="btn btn-text" data-close>Cancelar</button></div>`, { sheet: true });
                const list = m.querySelector('.picker-list');
                const draw = q => {
                    const f = options.filter(p => !q || up(p.displayName).includes(up(q)));
                    list.innerHTML = f.length ? f.map(p => `<button class="picker-row" data-id="${esc(p.id)}">${avatar(p.photoUrl, 36, 1, 'rgba(138,111,61,.3)')}<span>${esc(p.displayName)}</span></button>`).join('')
                        : '<div style="color:var(--muted);padding:16px;text-align:center">Nenhum jogador disponível.</div>';
                    list.querySelectorAll('[data-id]').forEach(b => b.onclick = () => {
                        const p = options.find(x => x.id === b.dataset.id);
                        const sel = [...Jogar.st.selected]; sel[i] = p;
                        m.close();
                        Jogar.set({ selected: sel });
                    });
                };
                draw('');
                m.querySelector('.picker-search').addEventListener('input', e => draw(e.target.value));
            },

            validateSelection() {
                const st = Jogar.st;
                if (st.selected.some(p => !p)) { Jogar.set({ error: 'Selecione todos os 4 jogadores.' }); return false; }
                if (new Set(st.selected.map(p => p.id)).size !== 4) { Jogar.set({ error: 'Jogadores não podem ser repetidos.' }); return false; }
                return true;
            },

            async startMatch() {
                const st = Jogar.st;
                if (st.loading || !Jogar.validateSelection()) return;
                Jogar.set({ loading: true, error: null });
                try {
                    activeCheckCache.at = 0;
                    if (!(await isModuleAvailable())) return Jogar.set({ loading: false, error: blockedMessage() });
                    const active = await api('webhook/partidas-em-andamento');
                    const names = st.selected.map(p => p.name);
                    let conflict = null;
                    for (const a of (Array.isArray(active) ? active : [])) {
                        const ap = [a.jogador1, a.jogador2, a.jogador3, a.jogador4];
                        conflict = names.find(n => ap.includes(n));
                        if (conflict) break;
                    }
                    if (conflict) return Jogar.set({ loading: false, error: `O participante ${conflict} já está vinculado a uma partida em andamento!` });
                    const ordered = st.selected.some(isNonMember) ? [...st.selected] : shuffleAvoidingSamePairing(st.selected);
                    const id = uuid();
                    await api('webhook/partidas-em-andamento', { method: 'POST', body: { id, jogador1: ordered[0].name, jogador2: ordered[1].name, jogador3: ordered[2].name, jogador4: ordered[3].name, cadastrador: S.user.name } });
                    activeCheckCache = { at: Date.now(), value: true };
                    Jogar.set({ loading: false, isActive: true, activeMatchId: id, selected: ordered, error: null });
                } catch (e) {
                    Jogar.set({ loading: false, error: 'Erro ao iniciar partida no banco de dados.' + (e.message ? `\n${e.message}` : '') });
                }
            },

            async cancelMatch() {
                const st = Jogar.st;
                if (!st.activeMatchId) return;
                Jogar.set({ loading: true, error: null });
                try {
                    await api('webhook/partidas-em-andamento/' + encodeURIComponent(st.activeMatchId), { method: 'DELETE' });
                    activeCheckCache.at = 0;
                    Jogar.set({ loading: false, isActive: false, activeMatchId: null, score1: 0, score2: 0, fechas: 0, isBuchoRe: false, isBuchoReEnabled: false, selected: [null, null, null, null] });
                } catch (e) {
                    Jogar.set({ loading: false, error: 'Erro ao cancelar partida no banco de dados.' });
                }
            },

            save() { return Jogar.st.editing ? Jogar.updateMatch() : Jogar.saveMatch(); },

            async saveMatch() {
                const st = Jogar.st;
                if (st.loading || !Jogar.validateSelection()) return;
                if (st.score1 < 6 && st.score2 < 6) return Jogar.set({ error: 'Placar de criança? Pelo menos uma dupla tem que ter 6 pontos. Joguem de verdade!' });
                Jogar.set({ loading: true, error: null });
                try {
                    if (!st.isActive && !(await isModuleAvailable())) return Jogar.set({ loading: false, error: blockedMessage() });
                    const [p1, p2, p3, p4] = st.selected;
                    const t1Win = st.score1 > st.score2;
                    const winners = t1Win ? [p1, p2] : [p3, p4];
                    const losers = t1Win ? [p3, p4] : [p1, p2];
                    const date = now();
                    await api('webhook/partidas', { method: 'POST', body: matchDto({ date, players: st.selected, score1: st.score1, score2: st.score2, wasBuchoRe: st.isBuchoRe, registeredBy: S.user.name }) });
                    const debit = st.isBuchoRe ? 3 : Math.min(st.score1, st.score2) === 0 ? 2 : 0;
                    if (debit > 0) await registerDebits({ date, losers, winners, debit, score1: st.score1, score2: st.score2, wasBuchoRe: st.isBuchoRe, registeredBy: S.user.name });
                    if (st.activeMatchId) await api('webhook/partidas-em-andamento/' + encodeURIComponent(st.activeMatchId), { method: 'DELETE' }).catch(() => {});
                    activeCheckCache.at = 0;
                    st.activeMatchId = null;
                    Jogar.set({ loading: false });
                    loadData();
                    Jogar.repeatDialog();
                } catch (e) {
                    Jogar.set({ loading: false, error: 'Erro ao salvar: ' + e.message });
                }
            },

            repeatDialog() {
                const m = openModal(`<h3 style="color:var(--green);font-weight:900">⚡ Partida Salva!</h3>
                    <div class="msg">Repetir com os mesmos jogadores? As duplas serão sorteadas novamente.</div>
                    <div class="modal-actions"><button class="btn btn-text" id="rp-no">Não, obrigado</button><button class="btn btn-gold" id="rp-yes" style="border-radius:12px">Sim, vamos!</button></div>`, { dismissable: false });
                m.querySelector('#rp-no').onclick = () => { m.close(); Jogar.onRepeat(false); };
                m.querySelector('#rp-yes').onclick = () => { m.close(); Jogar.onRepeat(true); };
            },

            async onRepeat(repeat) {
                const st = Jogar.st;
                if (!repeat) {
                    Object.assign(st, { selected: [null, null, null, null], score1: 0, score2: 0, fechas: 0, isBuchoRe: false, isBuchoReEnabled: false, isActive: false });
                    back();
                    return;
                }
                if (!(await isModuleAvailable())) {
                    return Jogar.set({ isActive: false, error: 'Fora do horário permitido para iniciar partidas!' });
                }
                const chosen = st.selected.filter(Boolean);
                const shuffle = chosen.length === 4 && !chosen.some(isNonMember);
                const prev = chosen.length === 4 ? [new Set([chosen[0].id, chosen[1].id]), new Set([chosen[2].id, chosen[3].id])] : null;
                const ordered = shuffle ? shuffleAvoidingSamePairing(chosen, prev) : chosen;
                const id = uuid();
                let ok = true;
                try {
                    await api('webhook/partidas-em-andamento', { method: 'POST', body: { id, jogador1: ordered[0].name, jogador2: ordered[1].name, jogador3: ordered[2].name, jogador4: ordered[3].name, cadastrador: S.user.name } });
                    activeCheckCache = { at: Date.now(), value: true };
                } catch (_) { ok = false; }
                Jogar.set({ selected: ordered, isActive: ok, activeMatchId: ok ? id : null, score1: 0, score2: 0, fechas: 0, isBuchoRe: false, isBuchoReEnabled: false, error: ok ? null : 'Erro ao iniciar partida repetida no banco de dados.' });
            },

            async updateMatch() {
                const st = Jogar.st;
                if (st.loading || !Jogar.validateSelection()) return;
                if (st.score1 < 6 && st.score2 < 6) return Jogar.set({ error: 'Placar de criança? Pelo menos uma dupla tem que ter 6 pontos. Joguem de verdade!' });
                Jogar.set({ loading: true, error: null });
                try {
                    const ed = st.editing;
                    if (!eqi(S.user.name, ed.registeredBy.name)) return Jogar.set({ loading: false, error: 'Apenas quem cadastrou a partida pode editá-la.' });
                    if (!(await canEditMatch({ date: ed.date }))) return Jogar.set({ loading: false, error: 'Só é possível editar a partida no mesmo dia e dentro do horário de cadastro.' });
                    const [p1, p2, p3, p4] = st.selected;
                    const t1Win = st.score1 > st.score2;
                    const winners = t1Win ? [p1, p2] : [p3, p4];
                    const losers = t1Win ? [p3, p4] : [p1, p2];
                    const oldDebit = ed.re ? 3 : Math.min(ed.s1, ed.s2) === 0 ? 2 : 0;
                    const newDebit = st.isBuchoRe ? 3 : Math.min(st.score1, st.score2) === 0 ? 2 : 0;
                    await api('webhook/partidas/' + encodeURIComponent(ed.id), { method: 'PUT', body: matchDto({ id: ed.id, date: ed.date, players: st.selected, score1: st.score1, score2: st.score2, wasBuchoRe: st.isBuchoRe, registeredBy: ed.registeredBy.name }) });
                    // Remove o débito antigo localizando-o pelas duplas/placar ORIGINAIS da partida.
                    if (oldDebit > 0) {
                        const [o1, o2, o3, o4] = ed.players;
                        const oT1 = ed.s1 > ed.s2;
                        const ow = oT1 ? [o1, o2] : [o3, o4], ol = oT1 ? [o3, o4] : [o1, o2];
                        const ov = `${ow[0].displayName}/${ow[1].displayName}`, op = `${ol[0].displayName}/${ol[1].displayName}`;
                        const placar = `${ed.s1}x${ed.s2}`, dstr = ymd(ed.date);
                        const buchos = await api('webhook/gravar-buchos').catch(() => []);
                        for (const b of (buchos || []).filter(b => b.placar === placar && String(b.data || '').slice(0, 10) === dstr && b.dupla_vencedora === ov && b.dupla_perdedora === op)) {
                            if (b.id != null) await api('webhook/gravar-buchos/' + b.id, { method: 'DELETE' });
                        }
                    }
                    if (newDebit > 0) await registerDebits({ date: ed.date, losers, winners, debit: newDebit, score1: st.score1, score2: st.score2, wasBuchoRe: st.isBuchoRe, registeredBy: ed.registeredBy.name });
                    Jogar.set({ loading: false, editing: null });
                    await loadData();
                    back();
                } catch (e) {
                    Jogar.set({ loading: false, error: 'Erro ao atualizar: ' + e.message });
                }
            },

            async dailyAwards() {
                const m = openModal(`<div style="background:var(--bg);border-radius:20px;padding:16px">
                    <div style="display:flex;align-items:center;justify-content:space-between"><div style="color:var(--green);font-weight:900;font-size:16px;font-family:var(--serif)">Destaques do dia</div><button class="icon-btn" style="width:32px;height:32px;color:var(--muted)" data-close>${ICONS.close}</button></div>
                    <div id="da-body" style="margin-top:12px;display:flex;justify-content:center;padding:24px"><div class="spinner"></div></div></div>`, { bare: true });
                await loadData();
                const a = calculateDailyAwards(S.ranking, S.users);
                const body = m.querySelector('#da-body');
                if (!body) return;
                body.outerHTML = (!a.best.length && !a.worst.length)
                    ? '<div style="color:var(--muted);font-size:13px;padding:16px 0">Ninguém atingiu o mínimo de 5 partidas hoje ainda.</div>'
                    : `<div style="margin-top:12px">${awardsRow(a)}</div>`;
            }
        };

        // Lista de jogadores elegíveis: ativos, fora de férias e sem bloqueio financeiro (débito do
        // mês anterior após o dia 10, ou de antes do mês anterior). "NÃO MEMBRO" é sempre elegível.
        function eligiblePlayers() {
            const n = now();
            const startCur = new Date(n.getFullYear(), n.getMonth(), 1);
            const startPrev = new Date(n.getFullYear(), n.getMonth() - 1, 1);
            const past10 = n.getDate() >= 11;
            const blocked = new Set();
            for (const e of S.entries) {
                if (e.status === 'PAID') continue;
                const u = S.users.find(x => x.id === e.userId);
                if (!u || isNonMember(u)) continue;
                const ms = new Date(e.dueDate.getFullYear(), e.dueDate.getMonth(), 1);
                if (ms < startPrev || (ms < startCur && past10)) blocked.add(e.userId);
            }
            return S.users
                .filter(u => isNonMember(u) || (u.isActive && !isOnVacationNow(u) && !blocked.has(u.id)))
                .sort((a, b) => a.displayName < b.displayName ? -1 : a.displayName > b.displayName ? 1 : 0);
        }

        // Com 4 jogadores só há 3 formações de dupla; ao repetir partida garante uma formação diferente.
        function shuffleAvoidingSamePairing(players, prev) {
            const shuffle = arr => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
            const pairing = o => [new Set([o[0].id, o[1].id]), new Set([o[2].id, o[3].id])];
            const eqSet = (a, b) => a.size === b.size && [...a].every(x => b.has(x));
            const same = (a, b) => (eqSet(a[0], b[0]) && eqSet(a[1], b[1])) || (eqSet(a[0], b[1]) && eqSet(a[1], b[0]));
            let attempt = shuffle(players);
            if (prev) { let g = 0; while (same(pairing(attempt), prev) && g++ < 20) attempt = shuffle(players); }
            return attempt;
        }

        // Match.toDTO(): pontos = bucho de ré -> vencedor + 2; 6x0 -> 7; senão diferença do placar.
        function matchDto({ id, date, players, score1, score2, wasBuchoRe, registeredBy }) {
            const w = Math.max(score1, score2), l = Math.min(score1, score2);
            const pts = wasBuchoRe ? w + 2 : (w === 6 && l === 0) ? w + 1 : Math.abs(score1 - score2);
            const [p1, p2, p3, p4] = players;
            return {
                id: id != null && /^\d+$/.test(String(id)) ? Number(id) : null,
                data: dtoDate(date),
                jogador1: p1.name, jogador2: p2.name, jogador3: p3.name, jogador4: p4.name,
                scored1: score1, scored2: score2, buchore: wasBuchoRe, pts,
                dupla_vencedora: score1 > score2 ? `${p1.name}/${p2.name}` : `${p3.name}/${p4.name}`,
                cadastrado_por: registeredBy
            };
        }

        // Débito do bucho: uma linha por perdedor; se um deles é "NÃO MEMBRO", o outro paga em dobro.
        async function registerDebits({ date, losers, winners, debit, score1, score2, wasBuchoRe, registeredBy }) {
            const base = {
                data: ymd(date), pago: false, placar: `${score1}x${score2}`,
                dupla_vencedora: `${winners[0].displayName}/${winners[1].displayName}`,
                dupla_perdedora: `${losers[0].displayName}/${losers[1].displayName}`,
                cadastrado_por: registeredBy, wasBuchoRe,
                obs: wasBuchoRe ? '[BUCHO DE RÉ]' : undefined
            };
            const nm1 = isNonMember(losers[0]), nm2 = isNonMember(losers[1]);
            const rows = nm1 && nm2 ? [] : nm1 ? [[losers[1], debit * 2]] : nm2 ? [[losers[0], debit * 2]] : [[losers[0], debit], [losers[1], debit]];
            for (const [p, v] of rows) await api('webhook/gravar-buchos', { method: 'POST', body: { ...base, jogador: p.name, valor: v } });
        }

        // ─── Finanças (FinanceScreen.kt / FinanceViewModel.kt) ───────────────────────
        const Financas = {
            filter: 'ALL',
            uploading: false,
            async open() {
                Financas.filter = 'ALL';
                enablePullToRefresh(() => Financas.refresh());
                if (S.loaded) Financas.render(); else Financas.renderLoading();
                await loadData();
                hideBoot();
                Financas.render();
                Financas.loadBancos();
            },
            async refresh() { await loadData(); Financas.render(); },
            bancos: [],
            async loadBancos() {
                try { Financas.bancos = await api('webhook/bancos-pix?apenasAtivos=true') || []; } catch (_) {}
            },
            renderLoading() {
                $('#app').innerHTML = `<div class="view">${topbar('Minhas finanças')}<div class="center-msg"><div class="spinner"></div></div></div>`;
            },
            debts() {
                return S.entries.filter(e => e.userId === S.user.id && e.status !== 'PAID').sort((a, b) => b.dueDate - a.dueDate);
            },
            totals() {
                const d = Financas.debts();
                return { due: d.filter(isVencido).reduce((a, e) => a + e.amount, 0), upcoming: d.filter(isAVencer).reduce((a, e) => a + e.amount, 0), count: d.filter(e => e.status === 'PENDING').length };
            },
            render() {
                if (location.hash !== '#/financas') return;
                if (!S.loaded) {
                    $('#app').innerHTML = `<div class="view">${topbar('Minhas finanças')}<div class="center-msg"><div style="font-size:40px">⚠️</div><div>${esc(S.loadError || 'Erro ao carregar')}</div><button class="btn btn-green" onclick="App.retry()">Tentar Novamente</button></div></div>`;
                    return;
                }
                const debts = Financas.debts();
                const t = Financas.totals();
                const f = Financas.filter;
                const filtered = f === 'ALL' ? debts : f === 'MONTHLY' ? debts.filter(e => e.type === 'MONTHLY_FEE') : debts.filter(e => e.type === 'BUCHO');
                const pill = (k, l) => `<button class="pill ${f === k ? 'on' : ''}" onclick="App.finFilter('${k}')">${l}</button>`;
                const saldoCol = (label, value, color, scope) => `<button class="saldo-col" ${value > 0 ? `onclick="App.pix('${scope}')"` : 'disabled'}>
                    <span class="v" style="color:${color}">${formatBRL(value)}</span>
                    <span class="l">${label}${value > 0 ? `<span class="pix-badge">${ICONS.pix}PIX</span>` : ''}</span></button>`;
                const fab = Financas.uploading
                    ? '<button class="fab busy" disabled><div class="spinner light"></div></button>'
                    : debts.some(e => e.status === 'PENDING') ? `<button class="fab" onclick="App.sendReceipt()" aria-label="Enviar comprovante">${ICONS.receipt}</button>` : '';

                $('#app').innerHTML = `<div class="view">${topbar('Minhas finanças')}${ptrIndicator}<div class="stack">
                    <div class="saldo">
                        <div class="k">MEU SALDO</div>
                        <div class="saldo-cols">${saldoCol('VENCIDO', t.due, 'var(--error)', 'VENCIDO')}<div class="div"></div>${saldoCol('A VENCER', t.upcoming, 'var(--amber)', 'A_VENCER')}</div>
                        <div class="cnt">${t.count === 1 ? '1 cobrança pendente' : `${t.count} cobranças pendentes`}</div>
                    </div>
                    <div class="pills">${pill('ALL', 'TODAS')}${pill('MONTHLY', 'MENSALIDADES')}${pill('BUCHO', 'BUCHOS')}</div>
                    ${filtered.length ? `<div class="caps">PENDENTES</div>${filtered.map(entryItem).join('')}` : '<div class="empty">Nenhum débito pendente! 🎉</div>'}
                    <div style="height:64px"></div>
                </div></div>${fab}`;
            }
        };

        function entryItem(e) {
            const monthly = e.type === 'MONTHLY_FEE';
            const upcoming = isCurrentMonthOrFuture(e.dueDate);
            const amount = e.status === 'PENDING' && upcoming
                ? `<div class="amt" style="color:var(--yellow)">${formatBRL(e.amount)}<small>A Vencer</small></div>`
                : `<div class="amt" style="color:var(--orange)">${formatBRL(e.amount)}</div>`;
            return `<button class="card entry" onclick="App.entryDetails('${esc(e.key)}')">
                <span class="ic">${monthly ? ICONS.calendar : ICONS.moneyOff}</span>
                <span class="info"><div class="tt">${monthly ? 'Mensalidade' : 'Bucho'} · ${esc(e.description)}</div><div class="dd">${monthly ? 'Vencimento' : 'Data da partida'}: ${dmy(e.dueDate)}</div></span>
                ${amount}
            </button>`;
        }

        function entryDetails(key) {
            const e = S.entries.find(x => x.key === key);
            if (!e) return;
            const monthly = e.type === 'MONTHLY_FEE';
            const row = (k, v, hl) => `<div class="detail" style="font-size:15px"><span class="k">${k}</span><span class="v ${hl ? 'hl' : ''}">${esc(v)}</span></div>`;
            openModal(`<div style="display:flex;align-items:center;justify-content:space-between"><h3 style="margin:0">${monthly ? 'Detalhes da Mensalidade' : 'Detalhes da Partida'}</h3><button class="icon-btn" style="color:var(--text)" data-close>${ICONS.close}</button></div>
                <div style="margin-top:16px">
                ${monthly ? row('Referência', e.reference || 'N/A') + row('Descrição', e.description)
                    : row('ID da Dívida', e.remoteId != null ? String(e.remoteId) : 'N/A (Local)') + row('Dupla Vencedora', e.winningPair || 'Não informado') + row('Dupla Perdedora', e.losingPair || 'Não informado') + row('Placar', e.description)}
                ${row(monthly ? 'Vencimento' : 'Data', dmy(e.dueDate))}
                ${row('Valor', formatBRL(e.amount), true)}
                </div>`, { sheet: true });
        }

        // Pix Copia e Cola com o valor já preenchido (gerado no backend). No navegador não dá para
        // detectar os apps de banco instalados, então o código é exibido para copiar (e em QR Code).
        async function pagarComPix(scope) {
            const t = Financas.totals();
            const valor = scope === 'A_VENCER' ? t.upcoming : t.due;
            const m = openModal(`<div style="font-weight:800;font-size:17px">Pix Copia e Cola</div>
                <div style="color:var(--muted);font-size:13px;margin:2px 0 12px">${scope === 'A_VENCER' ? 'A vencer (antecipado)' : 'Vencido'} · <b style="color:var(--green)">${formatBRL(valor)}</b></div>
                <div id="pix-body" style="display:flex;justify-content:center;padding:24px"><div class="spinner"></div></div>`, { sheet: true });
            let payload = null;
            try {
                const r = await api('webhook/pix-copia-cola?valor=' + valor.toFixed(2), { timeout: 15000 });
                payload = r && r.payload;
            } catch (_) {}
            const code = payload || CHAVE_PIX_CLUBE;
            const copiedMsg = payload ? 'Pix copiado! Cole no app do seu banco para pagar.' : `Chave Pix copiada: ${CHAVE_PIX_CLUBE}`;
            const isAndroid = /Android/i.test(navigator.userAgent);
            const banks = isAndroid ? (Financas.bancos || []) : [];
            const body = m.querySelector('#pix-body');
            if (!body) return;
            body.outerHTML = `<div>
                <div style="font-size:13px;color:var(--muted);margin-bottom:6px">${payload ? 'Código Pix (já com o valor):' : 'Não foi possível gerar o código completo. Chave Pix do clube:'}</div>
                <div class="pix-code">${esc(code)}</div>
                <button class="btn btn-gold" style="margin-top:12px" id="pix-copy">📋 Copiar código Pix</button>
                ${payload ? '<div class="qr" id="pix-qr"></div><div style="text-align:center;color:var(--muted);font-size:12px">Ou escaneie o QR Code com o app do banco</div>' : ''}
                ${banks.length ? `<div class="caps" style="margin-top:18px">ABRIR O APP DO BANCO</div><div style="color:var(--muted);font-size:12px;margin:2px 0 4px">Copie o código antes e cole no app.</div>
                    ${banks.map(b => `<a class="bank-row" href="intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=${encodeURIComponent(b.packageName)};end">🏦 ${esc(b.nomeExibicao)}</a>`).join('')}` : ''}
            </div>`;
            const copy = async () => {
                let ok = false;
                try { await navigator.clipboard.writeText(code); ok = true; } catch (_) {
                    try { const ta = document.createElement('textarea'); ta.value = code; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove(); } catch (_) {}
                }
                toast(ok ? copiedMsg : 'Não foi possível copiar automaticamente. Selecione o código e copie.');
                return ok;
            };
            m.querySelector('#pix-copy').onclick = copy;
            m.querySelectorAll('.bank-row').forEach(a => a.addEventListener('click', () => { copy(); }));
            copy();
            if (payload) renderQr(m.querySelector('#pix-qr'), payload);
        }

        function renderQr(el, text) {
            if (!el) return;
            const draw = () => { try { el.innerHTML = ''; new window.QRCode(el, { text, width: 360, height: 360, correctLevel: window.QRCode.CorrectLevel.M }); } catch (_) { el.remove(); } };
            if (window.QRCode) return draw();
            const s = document.createElement('script');
            s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
            s.onload = draw;
            s.onerror = () => el.remove();
            document.head.appendChild(s);
        }

        // Envio de comprovante: o jogador escolhe o que o comprovante cobre (vencido, a vencer ou
        // ambos), para a baixa automática marcar os débitos certos.
        function sendReceipt() {
            const t = Financas.totals();
            const escopos = [];
            if (t.due > 0) escopos.push(['VENCIDO', t.due, 'Vencido']);
            if (t.upcoming > 0) escopos.push(['A_VENCER', t.upcoming, 'A vencer (antecipado)']);
            if (t.due > 0 && t.upcoming > 0) escopos.push(['TUDO', t.due + t.upcoming, 'Vencido + a vencer']);
            if (escopos.length > 1) {
                const m = openModal(`<h3 style="font-size:17px">O comprovante é de qual pagamento?</h3>
                    ${escopos.map(([k, v, l]) => `<button class="opt-btn" data-k="${k}"><span class="grow">${l}</span><b>${formatBRL(v)}</b></button>`).join('')}
                    <div class="modal-actions"><button class="btn btn-text" data-close>Cancelar</button></div>`);
                m.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { m.close(); pickReceiptFile(b.dataset.k); });
            } else {
                pickReceiptFile(escopos.length ? escopos[0][0] : 'VENCIDO');
            }
        }

        function pickReceiptFile(escopo) {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*,application/pdf';
            input.onchange = () => { if (input.files && input.files[0]) uploadReceipt(input.files[0], escopo); };
            input.click();
        }

        async function uploadReceipt(file, escopo) {
            Financas.uploading = true;
            Financas.render();
            try {
                const base64 = await new Promise((resolve, reject) => {
                    const r = new FileReader();
                    r.onload = () => resolve(String(r.result).split(',')[1] || '');
                    r.onerror = () => reject(new Error('Falha ao ler arquivo.'));
                    r.readAsDataURL(file);
                });
                const pend = Financas.debts().filter(e => escopo === 'VENCIDO' ? isVencido(e) : escopo === 'A_VENCER' ? isAVencer(e) : (isVencido(e) || isAVencer(e)));
                // Taxa extra fica na tabela de buchos no servidor, então vai junto em bucho_ids.
                const buchos = pend.filter(e => e.type === 'BUCHO' || e.type === 'EXTRA_TAX');
                const mens = pend.filter(e => e.type === 'MONTHLY_FEE');
                const res = await api('webhook/receber-comprovante', {
                    method: 'POST', timeout: 120000,
                    body: {
                        jogador_nome: S.user.name,
                        valor_total: pend.reduce((a, e) => a + e.amount, 0),
                        bucho_ids: buchos.map(e => e.remoteId).filter(x => x != null),
                        mensalidade_ids: mens.map(e => String(e.remoteId)),
                        mensalidade_vencimentos: mens.map(e => ymd(e.dueDate)),
                        imagem_base64: base64
                    }
                });
                const baixa = !!(res && res.baixa_automatica);
                Financas.uploading = false;
                Financas.render();
                // Baixa automática já marcou os débitos como pagos: recarrega para refletir.
                if (baixa) loadData().then(() => Financas.render());
                await alertModal(baixa ? 'Pagamento confirmado! ✅' : 'Enviado!',
                    baixa ? 'Seu comprovante foi analisado e aprovado automaticamente. Suas pendências já foram baixadas!'
                        : 'Recebemos o seu comprovante. Ele será analisado manualmente e em breve AMILTON dará baixa em suas pendências!',
                    { dismissable: false });
            } catch (e) {
                Financas.uploading = false;
                Financas.render();
                alertModal('Erro no Envio', e.name === 'AbortError' ? 'O servidor demorou a responder.' : (e.message || 'Erro desconhecido ao enviar.'), { okLabel: 'Tentar Novamente' });
            }
        }

        // ─── Ranking (RankingScreen.kt / RankingViewModel.kt) ────────────────────────
        const Ranking = {
            list: [],
            async open() {
                enablePullToRefresh(() => Ranking.refresh());
                if (S.loaded) Ranking.render(); else Ranking.renderLoading();
                await loadData();
                hideBoot();
                Ranking.render();
            },
            async refresh() { await loadData(); Ranking.render(); },
            renderLoading() {
                $('#app').innerHTML = `<div class="view">${topbar('Ranking do mês')}<div class="stack">${'<div class="shimmer"></div>'.repeat(6)}</div></div>`;
            },
            build() {
                const stats = S.ranking.filter(r => !up(r.jogador).includes(NAO_MEMBRO)).map(r => {
                    const u = S.users.find(x => eqi(x.name, r.jogador) || eqi(x.displayName, r.jogador));
                    if (u && !u.isActive) return null;
                    return { ...r, photoUrl: u ? u.photoUrl : '' };
                }).filter(Boolean);
                const yearPos = new Map([...stats].sort((a, b) => b.pontos_ano - a.pontos_ano).map((p, i) => [p.jogador, i + 1]));
                return stats.map(p => ({ ...p, yearPos: yearPos.get(p.jogador) || 0 })).sort((a, b) => (b.pontos_mes - a.pontos_mes) || (b.pontos_ano - a.pontos_ano));
            },
            render() {
                if (location.hash !== '#/ranking') return;
                if (!S.loaded) {
                    $('#app').innerHTML = `<div class="view">${topbar('Ranking do mês')}<div class="center-msg" style="color:var(--orange)">${esc(S.loadError || 'Erro desconhecido')}<button class="btn btn-green" onclick="App.retry()">Tentar novamente</button></div></div>`;
                    return;
                }
                const list = Ranking.list = Ranking.build();
                if (!list.length) {
                    $('#app').innerHTML = `<div class="view">${topbar('Ranking do mês')}<div class="center-msg">Nenhum dado disponível no momento.</div></div>`;
                    return;
                }
                const pod = (p, pos) => {
                    if (!p) return `<div style="flex:${pos === 1 ? 1.15 : 1}"></div>`;
                    const size = pos === 1 ? 72 : 56;
                    const border = pos === 1 ? 'var(--yellow)' : pos === 2 ? 'rgba(138,111,61,.5)' : 'rgba(242,194,48,.45)';
                    const bar = pos === 1 ? ['var(--green)', 'var(--yellow)', 76] : pos === 2 ? ['#E7E2D4', 'var(--muted)', 56] : ['#F2EADB', 'var(--muted)', 44];
                    return `<button class="pod ${pos === 1 ? 'first' : ''}" onclick="App.playerDetails(${list.indexOf(p)})">
                        ${pos === 1 ? '<div class="crown">👑</div>' : ''}
                        ${avatar(p.photoUrl, size, pos === 1 ? 3 : 2, border)}
                        <div class="nm" style="font-size:${pos === 1 ? 14 : 12}px">${esc(firstName(p.jogador))}</div>
                        <div class="bar" style="height:${bar[2]}px;background:${bar[0]};color:${bar[1]}">${pos}º</div>
                    </button>`;
                };
                const row = (p, pos) => {
                    const bal = p.pontos_mes;
                    return `<button class="card rank-row" style="${bal < 0 && Math.abs(bal) >= 10 ? 'border-color:rgba(209,87,63,.4)' : ''}" onclick="App.playerDetails(${list.indexOf(p)})">
                        <span class="pos">${pos}</span>
                        ${avatar(p.photoUrl, 40, 1, 'rgba(138,111,61,.3)')}
                        <span class="info"><div class="nm">${esc(p.jogador)}</div><div class="sub">${p.partidas_mes} partidas · ${p.vitorias_ano} vitórias</div><div class="sub">${p.pontos_ano} pts no ano · ${p.yearPos}º no ano</div></span>
                        <span class="bal" style="color:${bal >= 0 ? 'var(--cyan)' : 'var(--orange)'}">${bal >= 0 ? '+' : ''}${bal} pts</span>
                    </button>`;
                };
                const rest = list.slice(3);
                $('#app').innerHTML = `<div class="view">${topbar('Ranking do mês')}${ptrIndicator}<div class="stack">
                    <div class="podium">${pod(list[1], 2)}${pod(list[0], 1)}${pod(list[2], 3)}</div>
                    ${rest.length ? `<div class="caps" style="margin:4px 4px -4px">CLASSIFICAÇÃO GERAL</div>${rest.map((p, i) => row(p, i + 4)).join('')}` : ''}
                </div></div>`;
            }
        };

        function playerDetails(i) {
            const p = Ranking.list[i];
            if (!p) return;
            const decided = p.vitorias_ano + p.derrotas_ano;
            const rate = decided > 0 ? Math.floor(p.vitorias_ano * 100 / decided) : 0;
            const metric = (k, v) => `<div class="metric"><div class="k">${k}</div><div class="v">${v}</div></div>`;
            const bk = (k, a, r) => `<div class="bk"><div class="k" style="color:var(--on-dark-muted);font-weight:800;letter-spacing:.4px">${k}</div><div class="v"><span style="color:var(--yellow)">${a}</span><span style="color:var(--on-dark-muted);font-size:12px;font-weight:400"> / </span><span style="color:var(--orange)">${r}</span></div></div>`;
            openModal(`<div class="pcard-dark">
                <div class="hd"><span class="nm">${esc(p.jogador)}</span><button class="icon-btn" data-close aria-label="Fechar">${ICONS.close}</button></div>
                <div class="metrics">${metric('PONTOS NO MÊS', p.pontos_mes)}<div class="vdiv"></div>${metric('PARTIDAS', p.partidas_mes)}<div class="vdiv"></div>${metric('APROVEITAMENTO ANUAL', rate + '%')}</div>
                <div class="metrics">${metric('PONTOS NO ANO', p.pontos_ano)}<div class="vdiv"></div>${metric('POSIÇÃO NO ANO', p.yearPos + 'º')}</div>
                <div class="buchos-box"><div class="k">BUCHOS APLICADOS / SOFRIDOS</div><div class="row">${bk('HOJE', p.buchos_aplicados_dia, p.buchos_sofridos_dia)}${bk('MÊS', p.buchos_aplicados_mes, p.buchos_sofridos_mes)}${bk('ANO', p.buchos_aplicados_ano, p.buchos_sofridos_ano)}</div></div>
            </div>`, { bare: true });
        }

        // ─── API pública para os handlers inline ────────────────────────────────────
        window.App = {
            go: navigate, back, retry: () => { S.loaded = false; route(); },
            profile, chooseAvatar, releaseNotes, logout, forgotPassword, saveApi,
            matchDetails, editMatch: id => { document.querySelectorAll('.modal').forEach(m => m.remove()); navigate('#/jogar/editar/' + encodeURIComponent(id)); },
            pickPlayer: i => Jogar.pickPlayer(i),
            scoreInc: t => Jogar.scoreInc(t), scoreDec: t => Jogar.scoreDec(t),
            fechas: d => Jogar.changeFechas(d), buchoRe: v => { Jogar.st.isBuchoRe = v; Jogar.render(); },
            startMatch: () => Jogar.startMatch(), saveMatch: () => Jogar.save(), cancelMatch: () => Jogar.cancelMatch(),
            dailyAwards: () => Jogar.dailyAwards(),
            finFilter: f => { Financas.filter = f; Financas.render(); },
            pix: pagarComPix, sendReceipt, entryDetails,
            playerDetails
        };

        // ─── Inicialização ──────────────────────────────────────────────────────────
        window.addEventListener('hashchange', route);

        // Ao voltar para o app: ressincroniza a hora e atualiza os dados em segundo plano.
        let hiddenAt = 0;
        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'hidden') { hiddenAt = Date.now(); return; }
            if (!S.user || Date.now() - hiddenAt < 30000) return;
            activeCheckCache.at = 0;
            await syncTime();
            const h = location.hash.replace(/^#/, '') || '/';
            if (h.startsWith('/jogar')) return; // não sobrescreve uma partida sendo marcada
            await loadData();
            if (h === '/') Dashboard.render();
            else if (h === '/financas') Financas.render();
            else if (h === '/ranking') Ranking.render();
        });

        if ('serviceWorker' in navigator) {
            const hadController = !!navigator.serviceWorker.controller;
            let reloading = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                // Nova versão do PWA ativada: recarrega uma vez para usar os arquivos novos,
                // exceto no meio do registro de uma partida.
                if (!hadController || reloading || location.hash.startsWith('#/jogar')) return;
                reloading = true;
                location.reload();
            });
            navigator.serviceWorker.register('./sw.js').then(reg => {
                setInterval(() => reg.update().catch(() => {}), 30 * 60 * 1000);
            }).catch(() => {});
        }

        syncTime();
        route();
    })();
    </script>
</body>
</html>
